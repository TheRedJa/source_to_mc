# src2mc configuration. Every key is optional; anything omitted keeps the
# default shown here. Pass with: src2mc convert map.bsp -c this-file.toml

[scale]
# Source units per Minecraft block. 16 is one Hammer grid square, making the
# 72-unit player 4.5 blocks tall. 32 is closer to vanilla proportions but loses
# fine trim; 8 doubles the detail and the block count.
units_per_block = 16.0

[transform]
# "bounds_min" puts the map's lowest corner at (0, y_base, 0).
# "map_origin" keeps Source's own origin.
origin_mode = "bounds_min"
y_base = 0
# Extra rotation about the vertical axis, in degrees.
rotate_yaw = 0.0
# Block-space shift applied last. `batch` sets this per map to lay several
# maps out side by side.
offset = [0, 0, 0]

[contents]
# Skip faces flagged as sky rather than building a ceiling over the map.
# Faces flagged nodraw, skip, hint or trigger are always dropped: the engine
# never draws them, so they are not surfaces.
skip_sky = true
# Skip brushes made entirely of nodraw/skip/hint/clip tool textures.
skip_tool_brushes = true
# Leave out the 3D skybox room: the sealed miniature of the horizon that the
# engine renders scaled up and far away. Converted literally it is a second,
# wrongly-sized map in a corner of the first, and the void between the two is
# most of the schematic's volume. For d1_trainstation_02 it is the difference
# between needing a custom dimension and fitting in a vanilla world.
skip_3d_skybox = true

# What to do with each brush contents flag. Either "skip", "solid" (let the
# material decide), or a forced block.
[contents.actions]
playerclip = "skip"
monsterclip = "skip"
areaportal = "skip"
origin = "skip"
water = { block = "minecraft:water" }
slime = { block = "minecraft:water" }
window = { block = "minecraft:glass" }
grate = { block = "minecraft:iron_bars" }
ladder = { block = "minecraft:ladder" }

[materials]
# "vanilla" picks vanilla blocks by rules and average colour, and needs no
# mods. "kubejs" generates a block per material carrying its real Source
# texture and writes a KubeJS pack registering them, which the schematics then
# require in order to paste. Textures are read from the game install; see the
# `textures` command if any turn up missing.
mode = "vanilla"

# Edge length of generated block textures. 16 matches vanilla.
texture_size = 16

# Split each texture across as many blocks as it really covers in the map,
# instead of squeezing all of it onto every block face. A 512-pixel wall
# texture at Hammer's default scale covers eight blocks of wall; shrunk onto
# one face it is a smear, cut into eight it reads as brick again and the
# pattern lines up across the wall. Costs one registered block per tile.
tile_textures = true
# Blocks the generated pack may register, or 0 for no limit. The real cost of
# splitting textures is not disk -- 100k blocks is about 60 MB of 16x16 PNGs --
# but what KubeJS pays to register them at startup, so the control is a ceiling
# on the pack. Textures are cut as finely as this allows and no finer, which
# means the same setting suits a single room and a whole campaign. `batch`
# plans one cap across every map, since it merges them into one pack.
#
# Entropy: Zero's 17 maps come to about 84k blocks with every texture at full
# resolution, so the default lets that through untouched.
max_blocks = 100000

# Hard ceiling on tiles per axis, whatever the budget allows. Rarely binding: a
# texture is never cut finer than its own resolution can feed, so most
# materials stop well short of this and the budget decides the rest.
tile_max = 64

# Extra game directories to search for .vmt/.vtf content. The map's own game
# directory and everything its gameinfo.txt mounts are searched automatically.
game_dirs = []

# Your own rules file, relative to this config. Its rules are tested before the
# built-in ones, so anything here wins. See the `materials` command for stubs.
# rules = "my-rules.toml"

# Also use the Half-Life 2 / Entropy: Zero rules shipped inside the binary.
builtin_rules = true

# Match anything no rule pins down against the average colour of its texture.
# Turning this off makes every unpinned material `fallback_block`.
auto_palette = true

# Which blocks colour matching may choose from: "full", or a comma-separated
# list of stone, concrete, wool, terracotta, wood, natural, metal, nether,
# exotic. A rule can narrow this further with its own `set`.
#
# "full" includes wool, which matches pale rendered facades better than
# anything else but is flammable; drop it by listing the sets you do want.
palette_set = "full"

# Used when neither a rule nor a colour has an answer. In practice this only
# happens for self-illuminated textures — monitors, logos — which Source stores
# no reflectivity for.
fallback_block = "minecraft:stone"

[fill]
# "hollow" keeps only the surface; "solid" fills brush interiors.
mode = "hollow"
# How many voxels deep the surface shell is.
shell_thickness = 1
# 6 = faces only, 26 = faces, edges and corners.
shell_neighborhood = 6
interior_block = "minecraft:stone"

[shapes]
# Fit half-height and stepped geometry to slabs and stairs, doubling the
# effective vertical resolution. Vanilla blocks only, and only for the block
# families that have slab and stair variants; anything else stays a full cube.
# Vanilla blocks only: KubeJS 2101 exposes just two block builders, `basic`
# and `detector`, so a generated textured block cannot become a slab or stair
# and keeps its full cube.
enabled = true

[displacement]
# Voxelize displacement surfaces: Source's terrain, cliffs and road surfaces.
enabled = true
# Voxels of solid backing driven into the surface behind it, so terrain is not
# a shell you fall through. The direction is the surface's own inward normal,
# so cliffs and ceilings are thickened the right way rather than downwards.
solidify = 2

[props]
# Voxelize prop_static models: the fences, railings, catwalks, crates, signs
# and lamps that fill a map's rooms. None of it is in any brush lump, so
# without this a converted map is an accurate but empty shell. Needs the game's
# content on the search path, since a map stores only the path to each model.
enabled = true
# Ignore props whose longest dimension is under this many Source units. At 16
# units per block anything smaller cannot be more than a stray cube, and maps
# are full of pebbles, cans and tufts of grass.
min_size = 12.0
# Ignore props over this many units; 0 keeps every size. The lever for backdrop
# scenery: distant architecture is placed as ordinary props thousands of units
# across, and one of them can be tens of thousands of blocks of a single dark
# material. Off by default, because that scenery really is there.
max_size = 0.0
# Model paths to leave out. Foliage is alpha-tested cards that voxelize into
# solid slabs, and an outdoor map has thousands of them.
skip = ["*props_foliage*", "*/foliage/*"]
# Voxels of backing driven along each triangle's inward normal. Props are
# usually closed shells already, so a fence stays one block thick.
solidify = 0

# Draw props as their real triangle mesh instead of voxelizing them. A forklift,
# a car or a rock was never designed for a grid, so cubing it is where the
# conversion looks worst. NeoForge's OBJ model loader renders an arbitrary mesh
# and a block_display entity places it at any angle, so the prop can just be
# itself. Needs the generated pack, so it only applies when
# `[materials] mode = "kubejs"`; vanilla output is unchanged.
models = true
# Also read props out of the entity lump — prop_physics, prop_dynamic and
# anything else naming a .mdl — rather than only the compiled sprp lump. That is
# where a map's crates, barrels, doors and cars are.
entity_props = true
# Resolution of a prop's own textures. Far above the 16x16 a block face gets,
# because a mesh shows its texture at real scale rather than squeezed onto a cube.
texture_size = 128
# Source models tile their sheets, and a resource pack texture is a sprite on a
# shared atlas where coordinates past 0..1 do not wrap. So the texture is
# repeated into a larger image instead, up to this many times per axis. Past it
# the coordinates wrap and a seam appears where they do.
texture_repeat_max = 4
# Move a prop vertically so it stands on the floor the conversion built rather
# than in it. A prop is placed to a fraction of a block; the floor under it is
# voxelized to whole ones, so the two disagree by up to a block and a crate sinks
# into the ground. Cubing the prop hid that, because the cubes were rounded by
# the same grid. A prop with nothing under it is left exactly where it was — a
# hanging lamp should not fall — and lifting never pushes a prop into a ceiling.
settle = true
# How far settling may move a prop, in blocks. The correction exists to undo the
# grid's own rounding, so a block covers it; further than that is a prop over a
# hole the conversion did not build, and moving it there would invent a position.
settle_max = 1.0
# Props at least this many Source units across get invisible barrier blocks, so
# you can stand on a container and walk through a traffic cone. 0 makes
# everything solid; a huge value nothing.
collision_min_size = 48.0
# Beyond view_range * 64 blocks a prop stops rendering. Display entities are
# drawn every frame rather than baked into the chunk mesh, so this is the lever
# if a busy map costs frames.
view_range = 1.0
# Models heavier than this are voxelized instead; 0 renders every model however
# many triangles it has.
max_triangles = 4000
# Light the mesh fully rather than by the single cell it stands in. A large prop
# in a dark cell otherwise goes black.
full_bright = false
# Mirror the V texture axis. Off, because Source and Minecraft agree: both run V
# downwards from the top of the image. The OBJ loader offers the flip for models
# authored in an OpenGL tool, and turning it on mirrors every sheet.
flip_v = false

[entities]
# Write entities.json alongside the schematics.
manifest = true
# "include" voxelizes brush entities with the world, "skip" leaves them out.
brush_entities = "include"

# "separate" writes one schematic per entity under out/entities/, since a door
# pasted into the world seals the doorway it is supposed to open.
[entities.classname_modes]
func_door = "separate"
func_door_rotating = "separate"
func_movelinear = "separate"
func_tracktrain = "separate"

[output]
# Edge length in blocks of each emitted .schem tile.
# Absent means one single schematic for the whole map (--single).
tile_size = 256
# Write a WorldEdit paste macro next to the tiles.
paste_script = true
# Write a datapack defining a dimension tall enough for the map, next to the
# schematics. Most Source maps do not fit vanilla's 384 blocks of height, and
# WorldEdit drops out-of-range blocks silently.
emit_dimension = false

[output.voxelize]
# "center" tests the voxel centre only (fastest).
# "samples" tests an NxNxN grid and compares against fill_threshold.
# "exact" clips the voxel cube against the brush for the true volume fraction.
# It is slower and meant for a final pass rather than for iterating.
mode = "samples"
samples = 3
fill_threshold = 0.5
# Guarantee at least one voxel layer for brushes thinner than a block, so
# E:Z's 4- and 8-unit trim does not vanish at 16 units/block.
preserve_thin = true

[performance]
# Worker threads; 0 uses one per core.
threads = 0
